name: curbfix

# Runs on every pull request that targets main.
#
#   Target  .github/scripts/curbfix-target.mjs        -> which app the PR changed, which pages
#   Detect  Detect/src/detect.ts  Playwright + axe-core  -> finds the violations
#   Tool 2  ai_call/src/fix.ts  Gemma 4            -> receives them, rewrites the files
#   (loop)  back to Detect until it reports nothing left to fix (or MAX_ITERATIONS)
#   Tool 3  Comment/src/comment.ts  GitHub API     -> posts the before/after on the PR
on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

# Least privilege: read the code, write only PR comments.
permissions:
    contents: read
    pull-requests: write

# A new push to the same PR cancels the older (now stale) run.
concurrency:
    group: curbfix-${{ github.event.pull_request.number }}
    cancel-in-progress: true

env:
    # Apps the bot can audit, in priority order: a PR is audited on the first one it changes.
    CURBFIX_APPS: website demo-app
    APP_PORT: "4173"
    OUT_DIR: curbfix-out
    MAX_ITERATIONS: "3"
    NEXT_TELEMETRY_DISABLED: "1"

jobs:
    audit:
        name: Detect, fix, verify
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # PRs from forks get no secrets (no GEMINI_API_KEY), so skip them.
        if: github.event.pull_request.head.repo.full_name == github.repository

        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # needed to diff against main and find the changed files

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      Detect/package-lock.json
                      Comment/package-lock.json
                      ai_call/package-lock.json
                      website/package-lock.json
                      demo-app/package-lock.json

            # Which app did this PR change, and which of its pages to audit.
            # Outputs app (empty = nothing to audit), kind (next|vite) and paths.
            - name: Choose the app to audit
              id: target
              env:
                  BASE_REF: origin/${{ github.base_ref }}
              run: node .github/scripts/curbfix-target.mjs

            - name: Install Detect dependencies
              if: steps.target.outputs.app != ''
              run: npm ci
              working-directory: Detect

            - name: Install app dependencies
              if: steps.target.outputs.app != ''
              run: npm ci
              working-directory: ${{ steps.target.outputs.app }}

            - name: Install Comment dependencies
              if: steps.target.outputs.app != ''
              run: npm ci
              working-directory: Comment

            - name: Install Tool 2 (fix) dependencies
              if: steps.target.outputs.app != ''
              run: npm ci
              working-directory: ai_call

            - name: Install Chromium
              if: steps.target.outputs.app != ''
              run: npx playwright install --with-deps chromium
              working-directory: Detect

            # ---------------------------------------------------------------
            # The loop. Contract between the tools:
            #   detect.ts  exit 0 -> nothing to fix        (loop ends, success)
            #              exit 2 -> violations found      (written to violations.json)
            #              other  -> real error            (workflow fails)
            #   fix.ts     reads violations.json (+ earlier attempts in $OUT_DIR/history)
            #              and edits the changed files in the working tree
            # ---------------------------------------------------------------
            - name: Detect -> Gemma 4 fix -> re-detect loop
              id: loop
              if: steps.target.outputs.app != ''
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  BASE_REF: origin/${{ github.base_ref }}
                  APP_DIR: ${{ steps.target.outputs.app }}
                  APP_KIND: ${{ steps.target.outputs.kind }}
                  APP_PATHS: ${{ steps.target.outputs.paths }}
              run: |
                  # GitHub runs this with `bash -eo pipefail`. The loop reads exit codes
                  # itself (detect returns 2 when it finds violations), so turn -e off.
                  set +e -uo pipefail
                  mkdir -p "$OUT_DIR/history"
                  status="clean"

                  # How to serve each kind of app. The app's own binary is exec'd, so
                  # $! is the server itself and `kill` really stops it.
                  case "$APP_KIND" in
                    next) serve=(node_modules/.bin/next start --port "$APP_PORT") ;;
                    vite) serve=(node_modules/.bin/vite preview --port "$APP_PORT" --strictPort) ;;
                    *) echo "::error::unsupported app kind '$APP_KIND'"; exit 1 ;;
                  esac
                  urls=()
                  for p in $APP_PATHS; do urls+=(--url "http://localhost:$APP_PORT$p"); done
                  echo "Auditing $APP_DIR ($APP_KIND): $APP_PATHS"

                  port_busy() { curl -s -o /dev/null "http://localhost:$APP_PORT"; }

                  # Build the app, serve it, run Detect, stop the server.
                  # Returns detect.ts's exit code.
                  run_detect() {
                    local label="$1"
                    (cd "$APP_DIR" && npm run build) || return 1
                    # A server left over from the previous round would serve the old build.
                    if port_busy; then echo "::error::port $APP_PORT is still in use"; return 1; fi
                    (cd "$APP_DIR" && exec "${serve[@]}") >> "$OUT_DIR/preview.log" 2>&1 &
                    local server=$!
                    (cd Detect && npx wait-on "http://localhost:$APP_PORT" --timeout 60000) || { kill $server; return 1; }
                    (cd Detect && npx tsx src/detect.ts \
                      "${urls[@]}" \
                      --out "$GITHUB_WORKSPACE/$OUT_DIR/violations.json" \
                      --screenshot "$GITHUB_WORKSPACE/$OUT_DIR/$label.png")
                    local code=$?
                    kill $server 2>/dev/null
                    wait $server 2>/dev/null
                    for _ in $(seq 1 20); do port_busy || break; sleep 0.5; done
                    return $code
                  }

                  for i in $(seq 1 "$MAX_ITERATIONS"); do
                    echo "::group::Iteration $i - Detect (detect)"
                    run_detect "iteration-$i"
                    code=$?
                    echo "::endgroup::"

                    [ "$i" -eq 1 ] && cp "$OUT_DIR/violations.json" "$OUT_DIR/violations-initial.json" 2>/dev/null

                    if [ "$code" -eq 0 ]; then
                      echo "Detect found nothing left to fix after $((i-1)) fix round(s)."
                      status="clean"; break
                    elif [ "$code" -ne 2 ]; then
                      echo "::error::Detect (detect) failed with exit code $code"
                      exit "$code"
                    fi

                    cp "$OUT_DIR/violations.json" "$OUT_DIR/history/violations-$i.json"

                    echo "::group::Iteration $i - Tool 2 (Gemma 4 fix)"
                    # Run from the repo root (relative paths below), with ai_call's own tsx.
                    ai_call/node_modules/.bin/tsx ai_call/src/fix.ts \
                      --violations "$OUT_DIR/violations.json" \
                      --history "$OUT_DIR/history" \
                      --base "$BASE_REF" \
                      --app "$APP_DIR" \
                      --out "$OUT_DIR/fixes-$i.json"
                    fix_code=$?
                    echo "::endgroup::"
                    [ "$fix_code" -ne 0 ] && { echo "::warning::Tool 2 (fix) exited $fix_code"; status="unverified"; break; }

                    # Last allowed round: one more detect to see if the final fix worked.
                    if [ "$i" -eq "$MAX_ITERATIONS" ]; then
                      run_detect "final"
                      [ $? -eq 0 ] && status="clean" || status="unverified"
                    fi
                  done

                  echo "status=$status" >> "$GITHUB_OUTPUT"

            # Tool 3: always runs, so the PR gets a comment even when the loop gave up.
            - name: Post / update PR comment
              if: always() && steps.loop.outcome != 'skipped'
              working-directory: Comment
              run: >-
                  npx tsx src/comment.ts
                  --dir "$GITHUB_WORKSPACE/$OUT_DIR"
                  --status "${{ steps.loop.outputs.status || 'error' }}"
                  --pr "${{ github.event.pull_request.number }}"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}

            - name: Upload screenshots and logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: curbfix-debug
                  path: ${{ env.OUT_DIR }}/
                  if-no-files-found: ignore
                  retention-days: 7
